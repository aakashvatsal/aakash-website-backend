
name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build NestJS on GitHub Actions
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
        timeout-minutes: 20

      - name: Verify and package build
        run: |
          set -euo pipefail
          test -s dist/main.js
          tar -czf backend-release.tar.gz \
            dist package.json package-lock.json
          ls -lh backend-release.tar.gz

      - name: Deploy compiled release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
        run: |
          set -euo pipefail

          : "${EC2_HOST:?Missing EC2_HOST}"
          : "${EC2_USER:?Missing EC2_USER}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY}"
          : "${EC2_APP_PATH:?Missing EC2_APP_PATH}"

          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ARCHIVE="/home/${EC2_USER}/backend-${RELEASE_ID}.tar.gz"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "Uploading compiled backend"

          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            backend-release.tar.gz \
            "${EC2_USER}@${EC2_HOST}:${ARCHIVE}"

          APP_ARG=$(printf '%q' "$EC2_APP_PATH")
          ID_ARG=$(printf '%q' "$RELEASE_ID")
          ARCHIVE_ARG=$(printf '%q' "$ARCHIVE")

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "APP_DIR=$APP_ARG RELEASE_ID=$ID_ARG ARCHIVE=$ARCHIVE_ARG bash -se" <<'REMOTE'
          set -Eeuo pipefail

          echo "=== Preparing release ==="

          RELEASE_DIR="$APP_DIR/releases/$RELEASE_ID"
          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          test -s "$RELEASE_DIR/dist/main.js"

          echo "=== Installing production dependencies ==="

          cd "$RELEASE_DIR"

          timeout 12m npm ci \
            --omit=dev \
            --no-audit \
            --no-fund

          echo "=== Preparing application switch ==="

          PREVIOUS=""

          if [ -L "$APP_DIR/dist" ]; then
            if [ -s "$APP_DIR/dist/main.js" ]; then
              PREVIOUS=$(readlink "$APP_DIR/dist")
            fi
          elif [ -d "$APP_DIR/dist" ]; then
            mv "$APP_DIR/dist" \
              "$APP_DIR/dist.incomplete.$RELEASE_ID"
          fi

          rollback() {
            echo "Deployment health check failed"

            if [ -n "$PREVIOUS" ]; then
              echo "Restoring previous release"

              ln -s "$PREVIOUS" \
                "$APP_DIR/.dist-rollback-$RELEASE_ID"

              mv -Tf \
                "$APP_DIR/.dist-rollback-$RELEASE_ID" \
                "$APP_DIR/dist"

              pm2 restart aakash-backend || true
            else
              echo "No valid previous release"
              pm2 stop aakash-backend || true
            fi
          }

          ln -s "$RELEASE_DIR/dist" \
            "$APP_DIR/.dist-next-$RELEASE_ID"

          mv -Tf \
            "$APP_DIR/.dist-next-$RELEASE_ID" \
            "$APP_DIR/dist"

          echo "=== Starting backend ==="

          cd "$APP_DIR"

          if pm2 describe aakash-backend >/dev/null 2>&1; then
            pm2 restart aakash-backend --update-env || true
          else
            pm2 start "$APP_DIR/dist/main.js" \
              --name aakash-backend \
              --cwd "$APP_DIR"
          fi

          echo "=== Checking backend health ==="

          HEALTHY=0

          for i in $(seq 1 20); do
            if curl --fail --silent \
              --max-time 5 \
              http://127.0.0.1:4000/api/v1/system/health \
              > /dev/null; then
              HEALTHY=1
              break
            fi

            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            pm2 logs aakash-backend \
              --lines 50 --nostream || true
            rollback
            exit 1
          fi

          sleep 5

          if ! curl --fail --silent \
            --max-time 10 \
            http://127.0.0.1:4000/api/v1/system/health \
            > /dev/null; then
            rollback
            exit 1
          fi

          echo "=== Deployment successful ==="

          pm2 save
          pm2 status

          rm -f "$ARCHIVE"
          echo "Release: $RELEASE_ID"

          REMOTE
